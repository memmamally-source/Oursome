# Checks every pull request: types, lint, unit tests and a website build.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: AI service checks (not deployed)
        run: npm ci --prefix server/ai && npm run check:server
      - name: Build the website
        run: npm run build:web
        env:
          EXPO_BASE_URL: /Oursome
