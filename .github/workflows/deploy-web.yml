# Publishes the website to GitHub Pages whenever main changes.
#
# One-time setup (repository owner): Settings → Pages → Build and deployment
# → Source: "GitHub Actions". GitHub Pages needs a public repository, or a
# paid GitHub plan for a private one.
# The site is served at https://<owner>.github.io/Oursome/ (or your custom
# domain); the base path is read from Pages, so no code change is needed.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - name: Build the website
        run: npm run build:web
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
          # Empty until the owner approves and deploys the AI service; the app then uses Basic mode.
          EXPO_PUBLIC_AI_ENDPOINT: ${{ vars.EXPO_PUBLIC_AI_ENDPOINT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
