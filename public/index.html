<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A warm, colourful organiser for you and the people you live with: calendar, tasks, reminders, shopping lists and a shared Our Space." />
    <meta name="theme-color" content="#FFF9F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181F" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Installable web app (PWA). __BASE__ is filled in by scripts/build-web.js. -->
    <link rel="manifest" href="__BASE__/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="__BASE__/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Oursome" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oursome — Life’s better together" />
    <meta property="og:description" content="Your calendar, tasks, reminders and shopping lists in one warm, colourful place, shared with the people you live with." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand fonts: two small variable files, never blocking the first paint. -->
    <link rel="preload" href="__BASE__/fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="__BASE__/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <style id="fonts">
      /* One variable font per family; each named weight is pinned so existing font names keep working. */
      @font-face { font-family: 'Nunito_700Bold'; src: url('__BASE__/fonts/nunito.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Nunito_800ExtraBold'; src: url('__BASE__/fonts/nunito.woff2') format('woff2'); font-weight: 800; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_400Regular'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_600SemiBold'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 600; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_700Bold'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff9f2;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown until the app's JavaScript renders, then replaced. */
      #boot {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font: 800 34px/1 'Nunito', ui-rounded, system-ui, sans-serif;
        color: #242632;
        letter-spacing: -1px;
      }
      #boot svg {
        animation: boot-spin 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #17181f;
        }
        #boot {
          color: #f5efe7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Oursome needs JavaScript to run. Please enable it and reload.</noscript>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Oursome">
        <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M 20.33 38.01 A 32 32 0 0 1 38.01 20.33" stroke="#FF7468" stroke-width="17" stroke-linecap="round" fill="none" />
          <path d="M 61.99 20.33 A 32 32 0 0 1 79.67 38.01" stroke="#FFC857" stroke-width="17" stroke-linecap="round" fill="none" />
          <path d="M 79.67 61.99 A 32 32 0 0 1 61.99 79.67" stroke="#79D6B0" stroke-width="17" stroke-linecap="round" fill="none" />
          <path d="M 38.01 79.67 A 32 32 0 0 1 20.33 61.99" stroke="#76C8F5" stroke-width="17" stroke-linecap="round" fill="none" />
          <circle cx="50" cy="50" r="7" fill="#B7A2ED" />
        </svg>
        <div>oursome<span style="color: #ff7468">.</span></div>
      </div>
    </div>
    <script>
      // If a screen's code from an older deploy is gone, reload once to get the new version.
      (function () {
        var KEY = 'oursome-reloaded-at';
        function recover(message) {
          if (!/Loading (module|chunk)|ChunkLoadError|dynamically imported module|Requiring unknown module/i.test(String(message))) return;
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem(KEY, String(Date.now()));
          location.reload();
        }
        window.addEventListener('error', function (e) { recover(e.message); });
        window.addEventListener('unhandledrejection', function (e) { recover(e.reason && (e.reason.message || e.reason)); });
        window.__oursomeRecoverChunk = recover;
      })();

      // Offline support. Only registered in production builds, where __BASE__ has been replaced.
      if ('serviceWorker' in navigator && !'__BASE__'.startsWith('__')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('__BASE__/sw.js', { scope: '__BASE__/' })
            .then(function () {
              // Once the app is idle, let the worker fetch the remaining screens for offline use.
              setTimeout(function () {
                navigator.serviceWorker.ready.then(function (reg) {
                  if (reg.active) reg.active.postMessage('warm');
                });
              }, 6000);
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
