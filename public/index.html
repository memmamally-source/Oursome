<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A calm shared home for couples, families and housemates: calendar, tasks, reminders, shopping lists, photo albums and a journal." />
    <meta name="theme-color" content="#F7FBFE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1A2B" media="(prefers-color-scheme: dark)" />
    <meta name="oursome-version" content="__VERSION__" />
    <meta name="color-scheme" content="light dark" />

    <!-- Installable web app (PWA). __BASE__ is filled in by scripts/build-web.js. -->
    <link rel="manifest" href="__BASE__/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="__BASE__/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Oursome" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oursome — Life’s better together" />
    <meta property="og:description" content="Your shared home: calendar, tasks, lists and memories, with the people you live with." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand font: Nunito Sans, one small variable file that never blocks the first paint. -->
    <link rel="icon" type="image/svg+xml" href="__BASE__/icons/favicon.svg" />
    <link rel="preload" href="__BASE__/fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    <style id="fonts">
      /* One variable font per family; each named weight is pinned so existing font names keep working. */
      @font-face { font-family: 'NunitoSans_400Regular'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_600SemiBold'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 600; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_700Bold'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'NunitoSans_800ExtraBold'; src: url('__BASE__/fonts/nunito-sans.woff2') format('woff2'); font-weight: 800; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f7fbfe;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Calm, visible keyboard focus everywhere. */
      :focus-visible {
        outline: 2px solid #1769aa;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* Shown until the app's JavaScript renders, then replaced. */
      #boot {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font: 800 34px/1 'NunitoSans_800ExtraBold', system-ui, sans-serif;
        color: #102a43;
        letter-spacing: -1px;
      }
      #boot svg {
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      #boot-slow {
        display: none;
        max-width: 280px;
        text-align: center;
        font: 400 16px/1.4 'NunitoSans_400Regular', system-ui, sans-serif;
        letter-spacing: 0;
        color: #64748b;
      }
      #boot-slow button {
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        background: #1769aa;
        color: #ffffff;
        font: 700 16px 'NunitoSans_700Bold', system-ui, sans-serif;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.96);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0b1a2b;
        }
        #boot {
          color: #eaf3fa;
        }
        #boot-slow {
          color: #a9bacb;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Oursome needs JavaScript to run. Please enable it and reload.</noscript>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Oursome">
        <svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" aria-hidden="true" viewBox="-2 -2 104 104"><defs>
    <linearGradient id="boot-ring" x1="0.1" y1="0.9" x2="0.9" y2="0.1"><stop offset="0" stop-color="#1769AA"/><stop offset="1" stop-color="#12B8B0"/></linearGradient>
    <linearGradient id="boot-house" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#1769AA"/><stop offset="1" stop-color="#0F4C80"/></linearGradient>
    <mask id="boot-gap" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120"><rect x="-10" y="-10" width="120" height="120" fill="#fff"/><path d="M 12.86 77.14 L 47.00 43.00 Q 50 40 53.00 43.00 L 87.14 77.14 A 46 46 0 0 1 12.86 77.14 Z" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/></mask>
    <mask id="boot-win" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120"><rect x="-10" y="-10" width="120" height="120" fill="#fff"/><rect x="40.70" y="61.50" width="8" height="8" rx="1.8" fill="#000"/><rect x="51.30" y="61.50" width="8" height="8" rx="1.8" fill="#000"/><rect x="40.70" y="72.10" width="8" height="8" rx="1.8" fill="#000"/><rect x="51.30" y="72.10" width="8" height="8" rx="1.8" fill="#000"/></mask>
  </defs>
  <path d="M 4 50 A 46 46 0 1 0 96 50 A 46 46 0 1 0 4 50 Z M 20 50 A 30 30 0 1 0 80 50 A 30 30 0 1 0 20 50 Z" fill-rule="evenodd" fill="url(#boot-ring)" mask="url(#boot-gap)"/>
  <path d="M 12.86 77.14 L 47.00 43.00 Q 50 40 53.00 43.00 L 87.14 77.14 A 46 46 0 0 1 12.86 77.14 Z" fill="url(#boot-house)" mask="url(#boot-win)"/></svg>
        <div>oursome</div>
        <div id="boot-slow">
          Taking longer than usual — your connection may be slow.<br />
          <button type="button" onclick="location.reload()">Try again</button>
        </div>
      </div>
    </div>
    <script>
      // If the app still hasn't replaced the loading screen after 10 s, say so and offer a retry.
      setTimeout(function () {
        var slow = document.getElementById('boot-slow');
        if (slow) slow.style.display = 'block';
      }, 10000);

      // If a screen's code from an older deploy is gone, reload once to get the new version.
      (function () {
        var KEY = 'oursome-reloaded-at';
        function recover(message) {
          if (!/Loading (module|chunk)|ChunkLoadError|dynamically imported module|Requiring unknown module/i.test(String(message))) return;
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem(KEY, String(Date.now()));
          location.reload();
        }
        window.addEventListener('error', function (e) { recover(e.message); });
        window.addEventListener('unhandledrejection', function (e) { recover(e.reason && (e.reason.message || e.reason)); });
        window.__oursomeRecoverChunk = recover;
      })();

      // Offline support. Only registered in production builds, where __BASE__ has been replaced.
      if ('serviceWorker' in navigator && !'__BASE__'.startsWith('__')) {
        // A new version took over from an older one: pick it up. Just opened → reload quietly;
        // otherwise offer a refresh, so nothing being typed is lost.
        var openedAt = Date.now();
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return;
          if (Date.now() - openedAt < 12000) return location.reload();
          if (document.getElementById('oursome-update')) return;
          var bar = document.createElement('div');
          bar.id = 'oursome-update';
          bar.setAttribute('role', 'status');
          bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:999px;background:#102A43;color:#FFFFFF;font:600 14px/1.3 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100vw - 32px)';
          var text = document.createElement('span');
          text.textContent = 'A new version of Oursome is ready';
          var btn = document.createElement('button');
          btn.textContent = 'Refresh';
          btn.style.cssText = 'border:0;border-radius:999px;padding:8px 14px;background:#59D5CF;color:#102A43;font:700 14px system-ui,sans-serif;cursor:pointer';
          btn.onclick = function () { location.reload(); };
          bar.appendChild(text);
          bar.appendChild(btn);
          document.body.appendChild(bar);
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('__BASE__/sw.js', { scope: '__BASE__/' })
            .then(function () {
              // Once the app is idle, let the worker fetch the remaining screens for offline use.
              setTimeout(function () {
                navigator.serviceWorker.ready.then(function (reg) {
                  if (reg.active) reg.active.postMessage('warm');
                });
              }, 6000);
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
