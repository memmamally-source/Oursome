# Publishes the site to GitHub Pages whenever main changes.
#
# One-time setup (repository owner): Settings → Pages → Build and deployment
# → Source: "GitHub Actions". Pages needs a public repository, or a paid
# GitHub plan for a private one. The build uses relative paths and hash
# routes, so it works at https://<owner>.github.io/<repo>/ or a custom domain
# with no code change.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
